name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64
          combine: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Windows
          path: output/**/*.geode

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: MacOS
          combine: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Mac
          path: output/**/*.geode

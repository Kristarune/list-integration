name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Geode CLI
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/geode-sdk/cli/main/install.ps1 | iex

      - name: Add Geode to PATH
        shell: powershell
        run: |
          echo "$env:USERPROFILE\.geode\bin" >> $env:GITHUB_PATH

      - name: Install Geode SDK Binaries
        shell: powershell
        run: |
          geode sdk install-binaries

      - name: Configure CMake
        shell: cmd
        env:
          GEODE_SDK: ${{ github.workspace }}\geode-sdk
        run: |
          cmake -B build -G Ninja -DGEODE_SDK=%GEODE_SDK% .

      - name: Build
        run: cmake --build build --config Release

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Windows
          path: |
            build/**/*.geode
            build/**/*.dll

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Geode CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/geode-sdk/cli/main/install.sh | bash

      - name: Add Geode to PATH
        run: |
          echo "$HOME/.geode/bin" >> $GITHUB_PATH

      - name: Install Geode SDK Binaries
        run: |
          geode sdk install-binaries

      - name: Configure CMake
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: |
          cmake -B build -G Ninja -DGEODE_SDK=$GEODE_SDK .

      - name: Build
        run: cmake --build build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Mac
          path: |
            build/**/*.geode
            build/**/*.dylib

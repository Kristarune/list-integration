name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: cmd
        env:
          GEODE_SDK: ${{ github.workspace }}\geode-sdk
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Windows
          path: |
            build/**/*.geode
            build/**/*.dll

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: |
          cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Mac
          path: |
            build/**/*.geode
            build/**/*.dylib

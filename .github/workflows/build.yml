# GitHub Actions Workflow for Geode Mod

Create a file at:

`.github/workflows/build.yml`

```yaml
name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build ^
            -G "Visual Studio 17 2022" ^
            -A x64
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Windows
          path: |
            build/**/*.geode
            build/**/*.dll

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Geode SDK
        run: |
          git clone --recursive https://github.com/geode-sdk/geode.git geode-sdk

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build cmake build-essential

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk

      - name: Build
        run: |
          cmake --build build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: ListsIntegrations-Android
          path: |
            build/**/*.geode
            build/**/*.so
```

## Repository Structure

Your repository should look like this:

```text
lists-integrations/
├── .github/
│   └── workflows/
│       └── build.yml
├── src/
├── include/
├── CMakeLists.txt
├── mod.json
└── README.md
```

## Important Notes

* Replace `yourname.lists-integrations` in `mod.json` with your actual Geode mod ID.
* Replace the GitHub source link in `mod.json`.
* Push the repository to GitHub before Actions can run.
* Built `.geode` files will appear in the Actions artifacts section.

